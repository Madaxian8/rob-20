[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.35"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
# Robinhood Chain mainnet (chain ID 4663) — dRPC load-balanced endpoint (keyed).
robinhood = "${ROBINHOOD_RPC}"
# Robinhood Chain testnet (chain ID 46630), faucet: https://faucet.testnet.chain.robinhood.com
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[etherscan]
robinhood = { key = "verifyContract", chain = 4663, url = "https://robinhoodchain.blockscout.com/api" }
robinhood_testnet = { key = "verifyContract", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api" }
